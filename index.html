<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Finance 247 redesigns</title>
<meta name="description" content="Links to the Car Finance 247 redesign prototypes and A/B test designs.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --purple: #6905F2; --purple-10: #F0E6FE; --purple-30: #D2B4FB; --page: #ECE6F7; --ink: #160132; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.5; background: var(--page); color: var(--ink); }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 20px; }

  header { padding: 28px 0 0; }
  h1 { margin: 0; font-size: clamp(1.5rem, 3.5vw, 2rem); line-height: 1.15; color: var(--purple); }
  .intro { margin: 6px 0 0; color: rgba(22, 1, 50, .75); }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .tabs { display: flex; gap: 6px; }
  .tab { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; padding: 7px 8px 7px 16px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; color: var(--purple); }
  .tab:hover { background: var(--purple-10); }
  .tab[aria-selected="true"] { background: var(--purple); color: #fff; }
  .tab:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
  .count { min-width: 1.6em; padding: 0 7px; border-radius: 999px; font-size: .75rem; line-height: 1.6; text-align: center; background: var(--purple-10); color: var(--purple); }
  .tab[aria-selected="true"] .count { background: rgba(255, 255, 255, .22); color: #fff; }

  .search { flex: 0 1 300px; min-width: 200px; margin-left: auto; }
  .search input { width: 100%; font: inherit; padding: 8px 14px; border: 0; border-radius: 999px; color: var(--ink); background: #fff; box-shadow: 0 0 0 1px rgba(105, 5, 242, .18); }
  .search input::placeholder { color: rgba(22, 1, 50, .5); }
  .search input:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 560px) { .search { flex-basis: 100%; } }

  [hidden] { display: none !important; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 20px; padding: 20px 0 48px; }
  .empty { margin: 0; padding: 32px 0 56px; color: rgba(22, 1, 50, .65); }

  .card { display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 10px 10px 14px; color: inherit; text-decoration: none;
    background: #fff; border-radius: 10px; box-shadow: 0 0 0 1px rgba(105, 5, 242, .1), 0 14px 30px -24px rgba(22, 1, 50, .5); transition: transform .25s ease, box-shadow .25s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px rgba(105, 5, 242, .35), 0 20px 36px -24px rgba(22, 1, 50, .6); }
  .card:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }

  /* The mini browser window: a slim title bar over a scaled-down copy of the real page */
  .win { overflow: hidden; border-radius: 6px; background: #fff; box-shadow: 0 0 0 1px rgba(22, 1, 50, .16); }
  .bar { display: flex; align-items: center; gap: 4px; padding: 5px 8px; background: #F3EFF9; border-bottom: 1px solid rgba(22, 1, 50, .1); }
  .bar i { width: 7px; height: 7px; border-radius: 50%; background: #cbc3dc; }
  .addr { margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .6875rem; color: rgba(22, 1, 50, .6); }
  .view { position: relative; overflow: hidden; background: #fff; }
  .view iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: top left; pointer-events: none; background: #fff; }

  .text { padding: 0 2px; }
  .text h2 { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 1rem; line-height: 1.3; }
  .text h2 svg { flex: none; width: 12px; height: 12px; margin-left: auto; color: var(--purple); opacity: .6; transition: transform .25s ease, opacity .25s ease; }
  .card:hover .text h2 svg { opacity: 1; transform: translate(2px, -2px); }
  .text p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 4px 0 0; font-size: .8125rem; line-height: 1.45; color: rgba(22, 1, 50, .7); }

  footer { padding: 0 0 32px; font-size: .8125rem; color: rgba(22, 1, 50, .6); }

  @media (prefers-reduced-motion: reduce) { .card, .text h2 svg { transition: none; } .card:hover { transform: none; } .card:hover .text h2 svg { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Car Finance 247 redesigns</h1>
    <p class="intro">Design prototypes and A/B tests in one place. Select a card to open it.</p>
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Design type">
        <button class="tab" role="tab" id="tab-prototypes" aria-controls="panel-prototypes" aria-selected="true">Prototypes <span class="count" id="count-prototypes"></span></button>
        <button class="tab" role="tab" id="tab-abtests" aria-controls="panel-abtests" aria-selected="false" tabindex="-1">A/B tests <span class="count" id="count-abtests"></span></button>
      </div>
      <label class="search">
        <span class="sr-only">Search designs</span>
        <input type="search" id="q" placeholder="Search designs" autocomplete="off">
      </label>
    </div>
  </header>
  <main>
    <section id="panel-prototypes" role="tabpanel" aria-labelledby="tab-prototypes">
      <div class="grid" id="grid">
        <noscript><p>Enable JavaScript to see the previews. Links:
          <a href="https://louis-b-work.github.io/help-guides/compare/" target="_blank">Help and guides homepage</a>,
          <a href="https://louis-b-work.github.io/help-guides/compare-am-i-eligible/" target="_blank">Am I Eligible guide category</a>,
          <a href="https://louis-b-work.github.io/lp-pistonheads/" target="_blank">PistonHeads landing page</a>,
          <a href="https://louis-b-work.github.io/cf247/" target="_blank">Car Finance 247 homepage</a>,
          <a href="https://louis-b-work.github.io/apply/" target="_blank">Apply form</a>.</p></noscript>
      </div>
      <p class="empty" id="empty-prototypes" hidden></p>
    </section>
    <section id="panel-abtests" role="tabpanel" aria-labelledby="tab-abtests" hidden>
      <div class="grid" id="abgrid"></div>
      <p class="empty" id="empty-abtests" hidden></p>
    </section>
  </main>
  <footer>Add designs to the DESIGNS and AB_TESTS lists at the bottom of this file. Each has an added date, and the newest are shown first.</footer>
</div>

<script>
// One entry per prototype. size is the width and height the page is laid out at before it is scaled into its window.
const DESIGNS = [
  { title: "Help & Guides homepage",
    description: "Side-by-side comparison of today's guides page, the redesign, and the SEO wireframe.",
    added: "2026-10-30T09:22",
    url: "https://louis-b-work.github.io/help-guides/compare/", size: [1280, 800] },
  { title: "Help & Guides: Am I Eligible?",
    description: "The Am I Eligible guide category page: today's page next to the redesign, and the wireframe.",
    added: "2026-10-30T11:40",
    url: "https://louis-b-work.github.io/help-guides/compare-am-i-eligible/", size: [1280, 800] },
  { title: "PistonHeads landing page",
    description: "The PistonHeads advert landing page: today's page next to the redesign and the minimal redesign.",
    added: "2026-10-30T09:22",
    url: "https://louis-b-work.github.io/lp-pistonheads/", size: [1280, 800] },
  { title: "Car Finance 247 homepage",
    description: "The homepage mockup, with a cog for comparing fonts, weights and the refinance landing page.",
    added: "2026-10-30T09:22",
    url: "https://louis-b-work.github.io/cf247/", size: [1280, 800] },
  { title: "Apply form",
    description: "The apply form redesign prototype: each step where people leave, built as a switch so it can be A/B tested.",
    added: "2026-10-30T09:22",
    url: "https://louis-b-work.github.io/apply/", size: [1280, 800] },
  { title: "Members’ Area: finance unavailable",
    description: "The vehicle page when finance is not available: the reason, the deposit or budget fix, and the other options, with a view switch to today’s panel.",
    added: "2026-11-10T13:55",
    url: "https://louis-b-work.github.io/ma-vdp-finance-redesign/", size: [1280, 800] },
  { title: "Social landing page",
    description: "The social advert landing page vehicle card: the new price, stats and call to action layout, with a view switch to today’s page.",
    added: "2026-11-16T11:02",
    url: "https://louis-b-work.github.io/lp-social/", size: [1280, 800] },
  { title: "Transac comms emails",
    description: "The nine emails sent after an application: each original next to the redesign, with a short list of what changed and why.",
    added: "2026-11-17T15:30",
    url: "https://louis-b-work.github.io/transactional-comms/", size: [1300, 800] },
  { title: "Circumstance Hub",
    description: "A new guides hub that groups every guide by situation, with the representative example in the header and a switch between V1 and V2.",
    added: "2026-11-19T15:50",
    url: "https://louis-b-work.github.io/guides-compliance-text/", size: [1280, 800] }
];

// Designs put forward for A/B tests.
const AB_TESTS = [
  { title: "PistonHeads landing page",
    description: "The PistonHeads advert landing page: today's page next to the redesign and the minimal redesign.",
    added: "2026-11-06T14:52",
    url: "https://louis-b-work.github.io/lp-pistonheads/", size: [1280, 800] },
  { title: "CarGurus landing page",
    description: "The CarGurus advert landing page, put forward for an A/B test.",
    added: "2026-11-06T14:52",
    url: "https://louis-b-work.github.io/lp-cargurus/", size: [1280, 800] },
  { title: "Apply form: Contact details",
    description: "The contact details step (page 2) of the apply form, redesigned and put forward for an A/B test.",
    added: "2026-11-06T15:04",
    url: "https://louis-b-work.github.io/apply/contact-details-p2/redesign.html", size: [1280, 800] },
  { title: "Apply form: Date of birth",
    description: "The date of birth step of the apply form, redesigned and put forward for an A/B test.",
    added: "2026-11-06T15:04",
    url: "https://louis-b-work.github.io/apply/date-of-birth/redesign.html", size: [1280, 800] }
];

// The prototypes open a welcome dialog on load. Inside a preview window it would cover the page, so it is hidden with CSS
// (nothing is clicked, so no saved choices change). All the pages are on the same origin, which is what allows this.
const CALM_CSS = [
  '[role="dialog"]', '[aria-modal="true"]', '#intro', '[class*="bg-blackcurrant/"][class*="fixed"]',
  'html, body { overflow: hidden !important; }'
];
const calmCss = CALM_CSS.slice(0, -1).join(",") + "{display:none !important}" + CALM_CSS[CALM_CSS.length - 1];

const ARROW = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h6v6M10 2 3 9"/></svg>';
const views = [];

// Builds one card and returns its element.
function makeCard(d) {
  const [w, h] = d.size;
  const a = document.createElement("a");
  a.className = "card";
  a.href = d.url;
  a.target = "_blank";
  a.rel = "noopener";
  a.title = d.title + ": " + d.description;
  a.dataset.search = (d.title + " " + d.description).toLowerCase();

  const win = document.createElement("div");
  win.className = "win";
  win.setAttribute("aria-hidden", "true");
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = "<i></i><i></i><i></i><span class='addr'></span>";
  bar.querySelector(".addr").textContent = d.url.replace(/^https?:\/\//, "");
  const view = document.createElement("div");
  view.className = "view";
  view.style.aspectRatio = w + " / " + h;
  const f = document.createElement("iframe");
  f.src = d.url;
  f.title = d.title + " preview";
  f.loading = "lazy";
  f.tabIndex = -1;
  f.setAttribute("sandbox", "allow-scripts allow-same-origin");
  f.style.width = w + "px";
  f.style.height = h + "px";
  f.addEventListener("load", () => {
    try {
      const s = f.contentDocument.createElement("style");
      s.textContent = calmCss;
      f.contentDocument.head.appendChild(s);
    } catch (e) { /* not same-origin: leave the page as it is */ }
  });
  view.appendChild(f);
  win.append(bar, view);

  const text = document.createElement("div");
  text.className = "text";
  text.innerHTML = "<h2><span></span>" + ARROW + "</h2><p></p>";
  text.querySelector("h2 span").textContent = d.title;
  text.querySelector("p").textContent = d.description;

  a.append(win, text);
  views.push({ view, f, w });
  return a;
}

const newestFirst = (a, b) => b.added.localeCompare(a.added); // stable, so equal dates keep their list order
const lists = {
  prototypes: { data: DESIGNS, grid: document.getElementById("grid") },
  abtests: { data: AB_TESTS, grid: document.getElementById("abgrid") }
};
Object.keys(lists).forEach((key) => {
  const list = lists[key];
  list.data.sort(newestFirst);
  list.cards = list.data.map((d) => { const c = makeCard(d); list.grid.appendChild(c); return c; });
  list.count = document.getElementById("count-" + key);
  list.empty = document.getElementById("empty-" + key);
});

// Scale each page down so it fills its window exactly.
function fit() { views.forEach(({ view, f, w }) => { f.style.transform = "scale(" + view.clientWidth / w + ")"; }); }
Object.keys(lists).forEach((key) => new ResizeObserver(fit).observe(lists[key].grid));

// Search: hides cards that don't match in both tabs, and keeps the tab counts in step.
const q = document.getElementById("q");
function applyFilter() {
  const term = q.value.trim().toLowerCase();
  Object.keys(lists).forEach((key) => {
    const list = lists[key];
    let shown = 0;
    list.cards.forEach((c) => {
      const match = !term || c.dataset.search.includes(term);
      c.hidden = !match;
      if (match) shown++;
    });
    list.count.textContent = shown;
    list.empty.hidden = shown > 0;
    list.empty.textContent = "No designs match “" + q.value.trim() + "”.";
  });
  fit();
}
q.addEventListener("input", applyFilter);
q.addEventListener("keydown", (e) => { if (e.key === "Escape" && q.value) { q.value = ""; applyFilter(); } });
applyFilter();

// Tabs: Prototypes (default) and A/B tests, kept in the URL hash so a tab can be linked to.
const TABS = ["prototypes", "abtests"];
const panels = { prototypes: document.getElementById("panel-prototypes"), abtests: document.getElementById("panel-abtests") };
function showTab(name) {
  TABS.forEach((t) => {
    const tab = document.getElementById("tab-" + t);
    panels[t].hidden = t !== name;
    tab.setAttribute("aria-selected", String(t === name));
    tab.tabIndex = t === name ? 0 : -1;
  });
  fit();
}
function selectTab(t) {
  history.replaceState(null, "", t === "prototypes" ? location.pathname : "#" + t);
  showTab(t);
}
TABS.forEach((t, i) => {
  const tab = document.getElementById("tab-" + t);
  tab.addEventListener("click", () => selectTab(t));
  tab.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const next = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
    selectTab(next);
    document.getElementById("tab-" + next).focus();
  });
});
const fromHash = () => (TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "prototypes");
window.addEventListener("hashchange", () => showTab(fromHash()));
showTab(fromHash());
</script>
</body>
</html>
